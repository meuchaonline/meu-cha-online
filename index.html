<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roberta & Túlio | Chá de Casa Nova</title>
<style>
html,body{margin:0;padding:0;background:#fffaf7;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center}
.page{width:100%;max-width:1024px;position:relative;line-height:0;background:#fffaf7}
.page>img{width:100%;height:auto;display:block}
.hotspot{position:absolute;display:block}
#inicio{left:42%;top:1.8%;width:11%;height:4%}
#lista{left:52%;top:1.8%;width:17%;height:4%}
#como{left:69%;top:1.8%;width:15%;height:4%}
#pix{left:66%;top:89.2%;width:22%;height:3.5%}
.gift-control{position:absolute;width:20.2%;height:4.95%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;line-height:1.1;background:#fffdfb}
.c1{left:4.0%;top:61.25%}.c2{left:28.0%;top:61.25%}.c3{left:52.0%;top:61.25%}.c4{left:76.0%;top:61.25%}
.c5{left:4.0%;top:80.5%}.c6{left:28.0%;top:80.5%}.c7{left:52.0%;top:80.5%}.c8{left:76.0%;top:80.5%}
.status{display:inline-block;padding:6px 12px;border-radius:999px;font-size:13px;line-height:1}
.available{background:#edf4e8;color:#5e7c4e}.reserved{background:#ffe7e5;color:#c86668}
.who{font-size:12px;color:#97837b;line-height:1.1;min-height:13px}
.gift-control button{width:92%;height:37px;border:1px solid #efb7b7;border-radius:7px;background:#fbdede;color:#9e343b;font-size:13px;cursor:pointer}
.gift-control button:disabled{background:#f5efee;color:#ad9a96;border-color:#ebdfdc;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(59,42,34,.46);display:none;align-items:center;justify-content:center;padding:18px;z-index:99;line-height:1.4}
.modal.open{display:flex}
.dialog{width:min(420px,94vw);background:#fffdfb;border:1px solid #ecdcd6;border-radius:18px;padding:25px;box-shadow:0 22px 70px rgba(64,44,35,.22);color:#49382f}
.dialog h2{font:30px Georgia,serif;margin:0 0 8px}.dialog p{margin:0 0 14px;color:#8f7c73;font-size:14px}
.dialog label{display:block;font-size:13px;margin:12px 0 6px}.dialog input{width:100%;box-sizing:border-box;border:1px solid #eadbd5;border-radius:9px;padding:12px;font-size:15px}
.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;border:0;border-radius:9px;padding:12px;font-weight:700;cursor:pointer}
.cancel{background:#f4ece8;color:#49382f}.confirm{background:#e9868d;color:white}
.success{display:none;text-align:center}.success.show{display:block}.form.hide{display:none}.big{font-size:42px;color:#e9868d;margin-bottom:6px}
.pixbox{background:#fff4f2;border:1px dashed #e7aaa9;border-radius:12px;padding:16px;text-align:center;margin:12px 0}.pixkey{font-weight:700;color:#8b5555}
@media(max-width:700px){
.gift-control{gap:2px}.status{font-size:1.75vw;padding:3px 6px}.who{font-size:1.55vw;min-height:8px}.gift-control button{font-size:1.55vw;height:3.1vw;min-height:20px}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://zqkeyhfhtoarnzbmjcif.supabase.co";
const SUPABASE_KEY = "sb_publishable_dSXhJMP6xS2ufIpktaCsLw_u8kCccsO";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const gifts = {
  panelas:"Jogo de Panelas",
  pratos:"Jogo de Pratos",
  liquidificador:"Liquidificador",
  toalhas:"Jogo de Toalhas",
  tacas:"Jogo de Taças",
  cafeteira:"Cafeteira",
  faqueiro:"Faqueiro",
  cesto:"Cesto de Roupas"
};

let reservations = {};
let currentId = null;
let refreshTimer = null;

function render() {
  document.querySelectorAll(".gift-control").forEach(function(el) {
    const id = el.dataset.id;
    const chosen = !!reservations[id];

    if (chosen) {
      el.innerHTML =
        '<div class="status reserved">🔒 Já escolhido</div>' +
        '<div class="who">&nbsp;</div>' +
        '<button type="button" disabled>Presente reservado</button>';
    } else {
      el.innerHTML =
        '<div class="status available">Disponível</div>' +
        '<div class="who">&nbsp;</div>' +
        '<button type="button">Escolher este presente</button>';

      el.querySelector("button").addEventListener("click", function() {
        openGift(id);
      });
    }
  });
}

async function loadReservations() {
  try {
    const { data, error } = await sb.rpc("list_gift_status");
    if (error) throw error;

    reservations = {};
    (data || []).forEach(function(item) {
      reservations[item.id] = item.is_reserved;
    });
    render();
  } catch (err) {
    console.error("Erro ao carregar presentes:", err);
  }
}

function openGift(id) {
  if (reservations[id]) return;

  currentId = id;
  document.getElementById("giftTitle").textContent = gifts[id];
  document.getElementById("guestName").value = "";
  document.getElementById("giftForm").classList.remove("hide");
  document.getElementById("giftSuccess").classList.remove("show");
  document.getElementById("giftModal").classList.add("open");

  setTimeout(function() {
    document.getElementById("guestName").focus();
  }, 60);
}

function closeGift() {
  document.getElementById("giftModal").classList.remove("open");
  currentId = null;
}

async function confirmGift() {
  const name = document.getElementById("guestName").value.trim();
  if (!name) {
    alert("Digite seu nome para confirmar.");
    return;
  }
  if (!currentId) return;

  const confirmButton = document.querySelector("#giftForm .confirm");
  confirmButton.disabled = true;
  confirmButton.textContent = "Reservando...";

  try {
    const { error } = await sb.rpc("reserve_gift", {
      p_id: currentId,
      p_name: name
    });

    if (error) {
      await loadReservations();
      alert("Este presente já foi escolhido por outra pessoa. Escolha outro, por favor.");
      closeGift();
      return;
    }

    await loadReservations();
    document.getElementById("giftForm").classList.add("hide");
    document.getElementById("giftSuccess").classList.add("show");
  } catch (err) {
    console.error(err);
    alert("Não foi possível confirmar agora. Tente novamente em alguns segundos.");
  } finally {
    confirmButton.disabled = false;
    confirmButton.textContent = "Confirmar presente";
  }
}

function openPix() {
  document.getElementById("pixModal").classList.add("open");
}
function closePix() {
  document.getElementById("pixModal").classList.remove("open");
}

document.getElementById("giftModal").addEventListener("click", function(e) {
  if (e.target.id === "giftModal") closeGift();
});
document.getElementById("pixModal").addEventListener("click", function(e) {
  if (e.target.id === "pixModal") closePix();
});

loadReservations();
refreshTimer = setInterval(loadReservations, 5000);
</script>
</body>
</html>
